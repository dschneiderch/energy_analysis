[project]
name = "energy"
version = "0.1.0"
description = "Pull home energy data (ecobee, Emporia, Home Assistant, weather, rates) into SQLite"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "websockets",
    "pyemvue",
    "python-ecobee-api==0.4.4",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
energy = "energy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy"]

[tool.pytest.ini_options]
markers = ["integration: hits live APIs"]
addopts = "-m 'not integration'"
testpaths = ["tests"]
